<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d17" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#041226" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="25%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #38bdf8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations */
      @keyframes pulse-flow {
        0% { stroke-dashoffset: 2400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radar-pulse {
        0% { r: 6; opacity: 0.9; }
        50% { r: 28; opacity: 0; }
        100% { r: 6; opacity: 0.9; }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes orb-glow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }

      .ecg-line {
        stroke: url(#pulse-grad);
        stroke-width: 2.5;
        fill: none;
        stroke-dasharray: 400 800;
        animation: pulse-flow 5s linear infinite;
        filter: url(#soft-glow);
      }
      .radar-ring {
        animation: radar-pulse 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: center;
      }
      .floating-tag-1 {
        animation: float-slow 4s ease-in-out infinite;
      }
      .floating-tag-2 {
        animation: float-reverse 4.5s ease-in-out infinite;
      }
      .glowing-orb {
        animation: orb-glow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M 0 60 H 1200 M 0 120 H 1200 M 0 180 H 1200 M 0 240 H 1200 M 0 300 H 1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M 120 0 V 360 M 240 0 V 360 M 360 0 V 360 M 480 0 V 360 M 600 0 V 360 M 720 0 V 360 M 840 0 V 360 M 960 0 V 360 M 1080 0 V 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle class="glowing-orb" cx="200" cy="80" r="140" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
  <circle class="glowing-orb" cx="1020" cy="280" r="160" fill="#0d9488" filter="url(#glow)" opacity="0.2" />
  <circle class="glowing-orb" cx="620" cy="340" r="130" fill="#2563eb" filter="url(#glow)" opacity="0.18" />

  <!-- Animated Dynamic ECG Heartbeat Lifeline -->
  <path class="ecg-line" d="M -50 280 L 150 280 L 180 255 L 205 315 L 235 220 L 265 330 L 295 280 L 520 280 L 545 260 L 565 310 L 595 210 L 625 335 L 655 280 L 880 280 L 905 255 L 925 315 L 955 215 L 985 330 L 1015 280 L 1250 280" />

  <!-- Radar Health Beacon Signal -->
  <g transform="translate(1100, 70)">
    <circle class="radar-ring" cx="0" cy="0" r="6" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- Floating Dynamic Tech Tags in Semi-Transparent Background (won't cover title) -->
  <g class="floating-tag-1" transform="translate(850, 42)">
    <rect width="145" height="30" rx="15" fill="#0f2942" stroke="#0284c7" stroke-width="1.2" opacity="0.85" />
    <text x="72" y="20" text-anchor="middle" class="tag-text" fill="#38bdf8">⚡ SMART on FHIR</text>
  </g>

  <g class="floating-tag-2" transform="translate(70, 42)">
    <rect width="135" height="30" rx="15" fill="#0f2942" stroke="#059669" stroke-width="1.2" opacity="0.85" />
    <text x="67" y="20" text-anchor="middle" class="tag-text" fill="#34d399">🛡️ HIPAA Compliant</text>
  </g>

  <g class="floating-tag-1" transform="translate(1015, 120)">
    <rect width="130" height="30" rx="15" fill="#13233a" stroke="#6366f1" stroke-width="1.2" opacity="0.85" />
    <text x="65" y="20" text-anchor="middle" class="tag-text" fill="#a5b4fc">🩺 Telehealth API</text>
  </g>

  <g class="floating-tag-2" transform="translate(45, 230)">
    <rect width="145" height="30" rx="15" fill="#13233a" stroke="#0ea5e9" stroke-width="1.2" opacity="0.85" />
    <text x="72" y="20" text-anchor="middle" class="tag-text" fill="#7dd3fc">🏥 EHR / EMR Portals</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g transform="translate(0, 0)">
    <!-- Healthcare Cross Icon Emblem -->
    <g transform="translate(600, 100)">
      <circle cx="0" cy="0" r="32" fill="#0f2d4a" stroke="#0284c7" stroke-width="2" filter="url(#soft-glow)" />
      <!-- Medical Cross -->
      <path d="M -7 -16 H 7 V -7 H 16 V 7 H 7 V 16 H -7 V 7 H -16 V -7 H -7 Z" fill="url(#primary-glow)" />
    </g>

    <!-- Main Title with high contrast in foreground -->
    <text x="600" y="172" text-anchor="middle" class="title-text">
      Awesome Healthcare Provider Portal
    </text>

    <!-- Subtitle -->
    <text x="600" y="208" text-anchor="middle" class="subtitle-text">
      Curated Directory of Enterprise SaaS &amp; Open-Source Patient Portals, Telehealth &amp; EHR Engines
    </text>

    <!-- Stat Pills in Foreground -->
    <g transform="translate(260, 236)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="200" height="34" rx="17" fill="#0d2137" stroke="#0284c7" stroke-width="1.4" />
      <text x="100" y="22" text-anchor="middle" class="badge-text" fill="#38bdf8">🏢 Enterprise SaaS Portals</text>

      <!-- Pill 2 -->
      <rect x="220" y="0" width="220" height="34" rx="17" fill="#0d262b" stroke="#059669" stroke-width="1.4" />
      <text x="330" y="22" text-anchor="middle" class="badge-text" fill="#34d399">🔓 Open-Source Engines</text>

      <!-- Pill 3 -->
      <rect x="460" y="0" width="220" height="34" rx="17" fill="#1b1c3b" stroke="#8b5cf6" stroke-width="1.4" />
      <text x="570" y="22" text-anchor="middle" class="badge-text" fill="#c084fc">⚡ HL7 FHIR &amp; SMART Stack</text>
    </g>
  </g>
</svg>
